<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ícono original de LasAmericas: Biblia abierta, cruz y llama (no es el logo oficial de la iglesia) -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3fb0"/>
      <stop offset=".55" stop-color="#1e5bd8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="llama" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fde047"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#fondo)"/>
  <!-- Llama -->
  <path d="M32 7c4 5 7 8 7 13a7 7 0 0 1-14 0c0-3 1.5-5 3-6.5-.3 2.6.7 4 2 4.5C29 14 31 11 32 7z" fill="url(#llama)"/>
  <!-- Cruz -->
  <rect x="30" y="22" width="4" height="22" rx="1.5" fill="#fff"/>
  <rect x="24.5" y="28" width="15" height="4" rx="1.5" fill="#fff"/>
  <!-- Biblia abierta -->
  <path d="M10 38c7-2 14-1.5 20 2.5v14c-6-3.5-13-4-20-2z" fill="#ffffff"/>
  <path d="M54 38c-7-2-14-1.5-20 2.5v14c6-3.5 13-4 20-2z" fill="#e8efff"/>
  <path d="M30 40.5v14h4v-14c-1.3-.8-2.7-.8-4 0z" fill="#f59e0b"/>
</svg>
